name: release gdextension
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      godot_version:
        required: true
        type: choice
        options:
          - "4.3"
          - "4.4"
          - "4.5"
          - "4.6"
          - "4.7"
        default: "4.6"
        description: "Target Godot API version"

env:
  GODOT_VERSION: ${{ inputs.godot_version || '4.6' }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db

concurrency:
  group: ci-scons-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdextension:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: clone Godot Cpp repository
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          depth: 1
          branch: master
          owner: 'godotengine'
          repository: 'godot-cpp'

      - name: setup for gdextension
        uses: ./.github/actions/setup-extension
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Retrieve the secret and decode it to a file
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        env:
          DEV_CERT_APPLICATION: ${{ secrets.DEV_CERT_APPLICATION }}
          DEV_CERT_PASS: ${{ secrets.DEV_CERT_PASS }}
          KC_PASS: ${{ secrets.KC_PASS }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12

          # import certificate and provisioning profile from secrets
          echo -n "$DEV_CERT_APPLICATION" | base64 --decode > $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
          security set-keychain-settings -lut 21600 ${{ env.KEYCHAIN_PATH }}
          security unlock-keychain -p "$KC_PASS" ${{ env.KEYCHAIN_PATH }}

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEV_CERT_PASS" -f pkcs12 -k ${{ env.KEYCHAIN_PATH }} -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" ${{ env.KEYCHAIN_PATH }}
          security list-keychain -d user -s ${{ env.KEYCHAIN_PATH }}

      - name: build Linux
        if: matrix.platform == 'linux'
        run: |
          ./scripts/release-gdextension-linux.sh api_version=${{ env.GODOT_VERSION }}

      - name: build macOS
        if: matrix.platform == 'macos'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          ./scripts/release-gdextension-macos.sh api_version=${{ env.GODOT_VERSION }}

          for f in ./bin/macos/*.framework
          do
            codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          done

      - name: build iOS
        if: matrix.platform == 'ios'
        env:
          DEV_ID_APPLICATION: ${{ secrets.DEV_ID_APPLICATION }}
        run: |
          ./scripts/release-gdextension-ios.sh api_version=${{ env.GODOT_VERSION }}

          # iOS ships XCFrameworks (device + simulator); sign the frameworks inside each slice.
          for f in ./bin/ios/*.xcframework/*/*.framework
          do
            codesign --force --verify --verbose --keychain ${{ env.KEYCHAIN_PATH }} --sign "${DEV_ID_APPLICATION}" $f --deep --options runtime --timestamp
          done

      - name: build Android
        if: matrix.platform == 'android'
        run: |
          ./scripts/release-gdextension-android.sh api_version=${{ env.GODOT_VERSION }}

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/release-gdextension-windows.ps1 api_version=${{ env.GODOT_VERSION }}

          Remove-Item -Recurse -Force ./bin/windows/*.exp
          Remove-Item -Recurse -Force ./bin/windows/*.lib

      - name: build Web
        if: matrix.platform == 'web'
        run: |
          ./scripts/release-gdextension-web.sh api_version=${{ env.GODOT_VERSION }}

      - id: commit
        uses: pr-mpt/actions-commit-hash@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ env.GODOT_VERSION }}-${{ matrix.platform }}-${{ steps.commit.outputs.short }}
          path: bin/
          if-no-files-found: error

  package:
    needs: gdextension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - id: commit
        uses: pr-mpt/actions-commit-hash@v4

      - name: Zip all artifacts
        run: |
          cd artifacts

          mkdir -p addons/spritestudio/bin
          cp ../misc/spritestudio.gdextension addons/spritestudio/
          cp ../LICENSE.md addons/spritestudio/

          mv extension-${{ env.GODOT_VERSION }}-android-${{ steps.commit.outputs.short }}/android addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-ios-${{ steps.commit.outputs.short }}/ios addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-macos-${{ steps.commit.outputs.short }}/macos addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-web-${{ steps.commit.outputs.short }}/web addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-windows-${{ steps.commit.outputs.short }}/windows addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-linux-${{ steps.commit.outputs.short }}/linux addons/spritestudio/bin/

          rm -rf ../output
          mkdir -p ../output
          mv addons ../output/
          
          # Create a ZIP file for GitHub Release
          cd ../output
          zip -r ssplayer-godot-extension-${{ env.GODOT_VERSION }}.zip addons/

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: ssplayer-godot-extension-${{ env.GODOT_VERSION }}-${{ steps.commit.outputs.short }}
          path: output

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/ssplayer-godot-extension-${{ env.GODOT_VERSION }}.zip
          draft: true
          generate_release_notes: true
