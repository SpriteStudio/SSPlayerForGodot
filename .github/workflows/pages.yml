name: Publish docs via GitHub Pages

# Build the MkDocs site and deploy it to GitHub Pages via the artifact method
# (no gh-pages branch) — matching SSPlayerForWeb / SSPlayerForRenPy.
#
# The published site is tied to releases, not to merges: a published release or a
# manual dispatch deploys, and nothing else does. This keeps the docs site in step
# with the release the SpriteStudio Docs portal links to, rather than running ahead
# of it on every merge. Every sibling player repository uses this same trigger pair.
on:
  release:
    types: [published]
  workflow_dispatch:

# Permissions required by the artifact-based Pages deploy. No contents:write —
# the gh-pages branch is gone.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here. Nothing builds the docs on a pull request, so there
      # is no PR run to catch a divergence between the two — the fewer places the build
      # is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-pages.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work
      # here — but then CI and the README would be running different things.) It stays a
      # step of its own so a dependency failure is legible as one in the run summary,
      # which is also why build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # scripts/build-pages.sh is the tree this job uploads. Here that is the two locale
      # builds and nothing else — the site carries no demo and no examples — so it runs
      # build-docs.sh and adds only what a working tree needs on top (the toolchain, and
      # a server to look at the result). Running it here is what keeps CI and the local
      # build from drifting apart, and it is the same command in every repository in the
      # family, whatever else that repository's site carries.
      #
      # One build per locale - there is no plugin producing both from a single run any
      # more - English first, because the English build wipes site/ and the Japanese site
      # lives inside it at site/ja. build-docs.sh owns that order; the reason it exists is
      # that the opposite order silently publishes a site with no Japanese pages at all.
      #
      # --strict fails the build on broken links / missing nav entries, so a publish
      # aborts rather than deploying a site with a dead link.
      #
      # Every option is spelled out rather than left to the script's defaults: they are
      # chosen for a working tree, and a publish should not change because one of them did.
      - name: Build the Pages tree (docs, both locales, strict validation)
        run: ./scripts/build-pages.sh prepare=no serve=no

      # Only the MkDocs output (site/) is served — no examples/demos to bundle.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
