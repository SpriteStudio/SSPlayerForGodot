name: PR Build

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  # Writes the develop Rust caches that PRs restore from, since PRs do not save
  # (see save-if below). weekly.yml cannot stand in: it builds the runtime in
  # release mode, and these jobs build it in debug. Weekly is enough: when
  # Cargo.lock differs, rust-cache still restores the newest cache built by the
  # same toolchain, so a PR that changes dependencies rebuilds only what changed.
  schedule:
    - cron: '0 0 * * 0'

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐧 PR Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, web]
    
    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: clone Godot Cpp repository
        uses: GuillaumeFalourd/clone-github-repo-action@19817562c346ff60f9935158dede6c5ece8fd0ac # v2.3
        with:
          depth: 1
          branch: master
          owner: 'godotengine'
          repository: 'godot-cpp'

      - name: Setup Rust (Stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "ss_player/SpriteStudio-SDK"
          # The key is the job id and the runner OS, which linux and web share.
          # Without the platform they would share one cache: only the first to
          # finish could save it, and the other would restore its target dir.
          key: ${{ matrix.platform }}
          # Only develop writes caches. A PR's cache is visible to that PR alone,
          # so saving one per PR would only fill the 10 GB quota and evict the
          # develop caches every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install Nightly Rust (Web only)
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly

      - name: Build Runtime (SDK)
        run: ./scripts/build-runtime.sh platform=${{ matrix.platform }} build=debug

      # Restore only: weekly.yml saves these on develop under the same key
      # prefix, and a copy saved here would be visible to this PR alone.
      - name: Setup SCons Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.scons_cache
          key: ${{ runner.os }}-${{ matrix.platform }}-scons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-scons-

      - name: setup for gdextension
        uses: ./.github/actions/setup-extension
        with:
          platform: ${{ matrix.platform }}
          os: ubuntu-latest

      - name: Build
        env:
          SCONS_CACHE: ~/.scons_cache
        run: |
          mkdir -p ~/.scons_cache
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/release-gdextension-linux.sh
          elif [ "${{ matrix.platform }}" = "web" ]; then
            ./scripts/release-gdextension-web.sh
          fi
