name: Weekly Build

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日の 00:00 UTC に実行
  workflow_dispatch:

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db
  SCONS_CACHE: ~/.scons_cache

permissions:
  contents: read

jobs:
  gdextension:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: clone Godot Cpp repository
        uses: GuillaumeFalourd/clone-github-repo-action@19817562c346ff60f9935158dede6c5ece8fd0ac # v2.3
        with:
          depth: 1
          branch: master
          owner: 'godotengine'
          repository: 'godot-cpp'

      - name: setup for gdextension
        uses: ./.github/actions/setup-extension
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Setup Rust (Stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "ss_player/SpriteStudio-SDK"
          key: ${{ matrix.platform }}

      - name: Setup SCons Cache
        uses: actions/cache@v3
        with:
          path: ~/.scons_cache
          key: ${{ runner.os }}-${{ matrix.platform }}-scons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-scons-

      # weekly は develop HEAD の検証なので、リリース版 SDK (download-sdk) では
      # なく submodule のソースから runtime をビルドする (pr.yml と同じ方針)。
      - name: Build Runtime (SDK)
        if: matrix.platform == 'linux'
        run: ./scripts/build-runtime.sh platform=linux build=release

      - name: Build Runtime (SDK, macOS universal)
        if: matrix.platform == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          ./scripts/build-runtime.sh platform=macos arch=universal build=release

      - name: Build Runtime (SDK, iOS)
        if: matrix.platform == 'ios'
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          ./scripts/build-runtime.sh platform=ios build=release

      - name: Build Runtime (SDK, Android)
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          ./scripts/build-runtime.sh platform=android build=release

      - name: Build Runtime (SDK, Web)
        if: matrix.platform == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly
          ./scripts/build-runtime.sh platform=web build=release

      - name: Build Runtime (SDK, Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-runtime.ps1 platform=windows build=release

      # Import the Developer ID Application certificate into an ephemeral keychain
      # so codesign (run inside the release scripts) can resolve the signing
      # identity. No-ops when the certificate secret is absent, leaving the
      # artifacts unsigned.
      - name: Set up signing keychain
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        continue-on-error: true # Weeklyでは署名できなくても通す
        env:
          SS_APPLE_CERTIFICATE: ${{ secrets.SS_APPLE_CERTIFICATE }}
          SS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SS_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SS_APPLE_CERTIFICATE" ]; then
            echo "SS_APPLE_CERTIFICATE not set — skipping keychain setup (artifacts will be unsigned)."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          # Random per-run password for the throwaway keychain; never persisted.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$SS_APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$SS_APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERTIFICATE_PATH"

      - name: build Linux
        if: matrix.platform == 'linux'
        run: ./scripts/release-gdextension-linux.sh

      # release-gdextension-macos.sh signs the frameworks when APPLE_SIGNING_IDENTITY
      # is present; no-op (unsigned) otherwise, so weekly stays green without secrets.
      - name: build macOS
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/release-gdextension-macos.sh

      # release-gdextension-ios.sh signs the XCFrameworks when APPLE_SIGNING_IDENTITY
      # is present; no-op (unsigned) otherwise.
      - name: build iOS
        if: matrix.platform == 'ios'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/release-gdextension-ios.sh

      - name: build Android
        if: matrix.platform == 'android'
        run: ./scripts/release-gdextension-android.sh

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/release-gdextension-windows.ps1
          Remove-Item -Recurse -Force ./bin/windows/*.exp
          Remove-Item -Recurse -Force ./bin/windows/*.lib

      - name: build Web
        if: matrix.platform == 'web'
        run: ./scripts/release-gdextension-web.sh
