name: release gdextension
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      godot_version:
        required: true
        type: choice
        options:
          - "4.6"
          - "4.7"
        default: "4.6"
        description: "Target Godot API version"
      upload_release:
        # タグ push は常にアップロードする。手動実行 (workflow_dispatch) では
        # 既定でビルドのみ行い、true を指定した場合だけ Release へ添付する
        # (v* タグの ref 上で実行したときのみ有効)。
        description: 'Upload to GitHub Release (only effective on a v* tag ref)'
        required: false
        default: false
        type: boolean

env:
  GODOT_VERSION: ${{ inputs.godot_version || '4.6' }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONIOENCODING: utf8
  KEYCHAIN_PATH: app-signing.keychain-db
  SCONS_CACHE: ~/.scons_cache

concurrency:
  group: ci-scons-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdextension:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (GCC)
            os: ubuntu-latest
            platform: linux

          - name: 🏁 Windows (x86_64, MSVC)
            os: windows-latest
            platform: windows

          - name: 🍎 macOS (universal)
            os: macos-latest
            platform: macos

          - name: 🤖 Android (arm64)
            os: ubuntu-latest
            platform: android

          - name: 🍏 iOS (arm64)
            os: macos-latest
            platform: ios

          - name: 🌐 Web (wasm32)
            os: ubuntu-latest
            platform: web

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: clone Godot Cpp repository
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          depth: 1
          branch: master
          owner: 'godotengine'
          repository: 'godot-cpp'

      # Fetch the prebuilt SDK runtime (headers + static libs) that the
      # GDExtension build links against. Requires the SpriteStudio-SDK release
      # assets to be downloadable from GitHub Releases.
      - name: Download Prebuilt SDK (ssruntime)
        if: matrix.platform != 'windows'
        run: ./scripts/download-sdk.sh

      - name: Download Prebuilt SDK (ssruntime, Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/download-sdk.ps1

      - name: setup for gdextension
        uses: ./.github/actions/setup-extension
        with:
          platform: ${{ matrix.platform }}
          os: ${{ matrix.os }}

      - name: Setup SCons Cache
        uses: actions/cache@v3
        with:
          path: ~/.scons_cache
          key: ${{ runner.os }}-${{ matrix.platform }}-scons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-scons-

      # Import the Developer ID Application certificate into an ephemeral keychain
      # so codesign (run inside the release scripts) can resolve the signing
      # identity. No-ops when the certificate secret is absent, leaving the
      # artifacts unsigned.
      - name: Set up signing keychain
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        env:
          SS_APPLE_CERTIFICATE: ${{ secrets.SS_APPLE_CERTIFICATE }}
          SS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SS_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SS_APPLE_CERTIFICATE" ]; then
            echo "SS_APPLE_CERTIFICATE not set — skipping keychain setup (artifacts will be unsigned)."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          # Random per-run password for the throwaway keychain; never persisted.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$SS_APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create, harden and unlock a temporary keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and authorize codesign to use its private key.
          security import "$CERTIFICATE_PATH" -P "$SS_APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the keychain on the search list so codesign resolves the identity
          # (keep login.keychain-db so other tooling still works).
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERTIFICATE_PATH"

      # Decode the App Store Connect API key (.p8) used to notarize the macOS
      # frameworks and expose its path to the macOS build step. No-ops when the
      # secret is absent. macOS only (iOS is not notarized).
      - name: Prepare Apple API key
        if: matrix.platform == 'macos'
        env:
          SS_APPLE_API_KEY_BASE64: ${{ secrets.SS_APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$SS_APPLE_API_KEY_BASE64" ]; then
            echo "SS_APPLE_API_KEY_BASE64 not set — skipping API key setup (frameworks will not be notarized)."
            exit 0
          fi
          echo "$SS_APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: build Linux
        if: matrix.platform == 'linux'
        run: |
          ./scripts/release-gdextension-linux.sh api_version=${{ env.GODOT_VERSION }}

      # release-gdextension-macos.sh signs the frameworks (hardened runtime +
      # timestamp) when APPLE_SIGNING_IDENTITY is present, and notarizes them
      # when the APPLE_API_* App Store Connect credentials are also present.
      # APPLE_API_KEY_PATH is set by the "Prepare Apple API key" step above.
      - name: build macOS
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.SS_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.SS_APPLE_API_KEY }}
        run: |
          ./scripts/release-gdextension-macos.sh api_version=${{ env.GODOT_VERSION }}

      # release-gdextension-ios.sh signs the XCFrameworks inside-out (no hardened
      # runtime; iOS is not notarized) when APPLE_SIGNING_IDENTITY is present.
      - name: build iOS
        if: matrix.platform == 'ios'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.SS_APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/release-gdextension-ios.sh api_version=${{ env.GODOT_VERSION }}

      - name: build Android
        if: matrix.platform == 'android'
        run: |
          ./scripts/release-gdextension-android.sh api_version=${{ env.GODOT_VERSION }}

      - name: build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/release-gdextension-windows.ps1 api_version=${{ env.GODOT_VERSION }}

          Remove-Item -Recurse -Force ./bin/windows/*.exp
          Remove-Item -Recurse -Force ./bin/windows/*.lib

      - name: build Web
        if: matrix.platform == 'web'
        run: |
          ./scripts/release-gdextension-web.sh api_version=${{ env.GODOT_VERSION }}

      - id: commit
        uses: pr-mpt/actions-commit-hash@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ env.GODOT_VERSION }}-${{ matrix.platform }}-${{ steps.commit.outputs.short }}
          path: bin/
          if-no-files-found: error

  package:
    needs: gdextension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - id: commit
        uses: pr-mpt/actions-commit-hash@v4

      - name: Zip all artifacts
        run: |
          cd artifacts

          mkdir -p addons/spritestudio/bin
          cp ../misc/spritestudio.gdextension addons/spritestudio/
          cp ../LICENSE.md addons/spritestudio/

          mv extension-${{ env.GODOT_VERSION }}-android-${{ steps.commit.outputs.short }}/android addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-ios-${{ steps.commit.outputs.short }}/ios addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-macos-${{ steps.commit.outputs.short }}/macos addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-web-${{ steps.commit.outputs.short }}/web addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-windows-${{ steps.commit.outputs.short }}/windows addons/spritestudio/bin/
          mv extension-${{ env.GODOT_VERSION }}-linux-${{ steps.commit.outputs.short }}/linux addons/spritestudio/bin/

          rm -rf ../output
          mkdir -p ../output
          mv addons ../output/
          
          # Create a ZIP file for GitHub Release
          cd ../output
          zip -r ssplayer-godot-extension-${{ env.GODOT_VERSION }}.zip addons/

          # Canonical checksum manifest so a consumer can verify the downloaded
          # zip's integrity (`sha256sum -c SHA256SUMS --ignore-missing`). Covers
          # the zips built by THIS run; a follow-up dispatch for another Godot
          # version replaces it with one covering only its own zip.
          sha256sum *.zip > SHA256SUMS

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: ssplayer-godot-extension-${{ env.GODOT_VERSION }}-${{ steps.commit.outputs.short }}
          path: output

      # タグ push では常に draft を作成。workflow_dispatch では upload_release=true
      # を付けた場合のみ (SDK の release.yml と同じゲート)。どちらも v* タグ上に限る。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.upload_release)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            output/ssplayer-godot-extension-${{ env.GODOT_VERSION }}.zip
            output/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # SDK の release.yml と違い、こちらはタグ push で自動起動するため
          # draft で作成し、内容確認後に手動で Publish する (SDK 側は
          # upload_release=true を付けた明示的な dispatch 自体が公開ゲート)。
          draft: true
          # SemVer プレリリース (例: v7.0.0-beta.1) はタグ名に '-' を含むため
          # 自動的に prerelease 扱いにする。正式版 (v7.1.0) は false。
          # draft 上に設定され、Publish 後もそのまま引き継がれる。
          prerelease: ${{ contains(github.ref_name, '-') }}
