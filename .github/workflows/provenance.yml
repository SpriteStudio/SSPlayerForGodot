name: Provenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the scanners
        run: pip install scanoss==1.54.2 scancode-toolkit==32.5.0

      - name: Export the tracked files
        run: |
          git archive -o "$RUNNER_TEMP/tracked.tar" HEAD
          mkdir "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
          tar -xf "$RUNNER_TEMP/tracked.tar" -C "$RUNNER_TEMP/src"

      - name: SCANOSS
        run: scanoss-py scan --no-wfp-output --threads 1 -o "$RUNNER_TEMP/out/scanoss.json" "$RUNNER_TEMP/src"

      - name: ScanCode
        run: scancode -c -l -n 4 --quiet --strip-root --json-pp "$RUNNER_TEMP/out/scancode.json" "$RUNNER_TEMP/src"

      - name: Summarize
        working-directory: ${{ runner.temp }}/out
        run: |
          {
            echo '## SCANOSS'
            echo
            echo '| File | Match | Lines | Component | Source file | Source lines |'
            echo '| --- | --- | --- | --- | --- | --- |'
            jq -r 'to_entries[] | .key as $f | .value[] | select(.id != "none")
              | "| `\($f)` | \(.id) \(.matched) | \(.lines) | [\(.component) \(.version)](\(.url)) | `\(.file)` | \(.oss_lines) |"' scanoss.json
            echo
            echo '## ScanCode'
            echo
            echo '| File | Copyright holders | License |'
            echo '| --- | --- | --- |'
            jq -r '.files[] | select(.type == "file")
              | {path, holders: ([.holders[].holder] | unique | map(select(test("CRI Middleware") | not))), license: .detected_license_expression_spdx}
              | select((.holders | length > 0) or (.license != null and .license != "BSD-3-Clause"))
              | "| `\(.path)` | \(.holders | join("; ")) | \(.license // "") |"' scancode.json
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ runner.temp }}/out
          retention-days: 7
