# Issues are for bugs and feature requests. Everything else has a better home —
# see SUPPORT.md, which these links mirror.
#
# One link the sibling players carry is deliberately absent: the shared
# SpriteStudio core's issue tracker. SpriteStudio-SDK is not public, so it
# would 404 for exactly the people who would follow it.
blank_issues_enabled: false
contact_links:
  - name: ❓ Question about how to use the player / 使い方の質問
    url: https://spritestudio.jp/community/
    about: Implementation advice and tips, in the official community forum. Issues are not for usage questions.

  - name: 🔒 Private inquiry (English)
    url: https://www.webtech.co.jp/contact/en.html
    about: Sensitive reports and contractual support. The English form has no file upload — ask here and we will arrange a transfer. Never attach proprietary data to a public issue.

  - name: 🔒 個別のお問い合わせ・データ送付（日本語）
    url: https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/
    about: 非公開のご相談、再現データの送付（zip・8MB まで）、契約に基づくサポート。公開 Issue に業務データを添付しないでください。

  - name: 🛡️ Security vulnerability / 脆弱性の報告
    url: https://github.com/cri-middleware/SSPlayerForGodot/blob/HEAD/SECURITY.md
    about: Do not open a public issue. See the security policy for how to report privately.
