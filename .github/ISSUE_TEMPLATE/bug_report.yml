name: Bug Report / バグ報告
description: Create a report to help us improve SSPlayerForGodot. / 不具合の報告
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! / 不具合の報告ありがとうございます！
        Please provide as much information as possible to help us investigate. / 調査をスムーズに行うため、可能な限り詳細な情報を提供してください。

  - type: textarea
    id: description
    attributes:
      label: Description / 不具合の内容
      description: A clear and concise description of what the bug is. / どのような不具合が発生しているか、簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / 再現手順
      description: Steps to reproduce the behavior. / 不具合を再現させるための手順を詳しく書いてください。
      placeholder: |
        1. Open '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior / 期待される動作
      description: A clear and concise description of what you expected to happen. / 本来どのような動作を期待していたか説明してください。
    validations:
      required: true

  - type: input
    id: target_engine
    attributes:
      label: Target Engine / 組み込み先のエンジン
      description: Unity, Unreal Engine, Web/JS, Custom C++ Engine, etc. / Unity、Unreal Engine、Webブラウザ、独自のC++エンジンなど。
    validations:
      required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK Version / SDK のバージョン
      description: e.g. v7.0.0-alpha01 or commit hash. / バージョンタグ（v7.0.0-alpha01等）、またはコミットハッシュ。
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS / Compiler / Rust Version
      description: OS version, Rust version, compiler info. / OS バージョン、Rust のバージョン、コンパイラの情報など。
      placeholder: e.g. macOS Sonoma, Rust 1.77
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context & Minimal Code / 補足情報・最小再現コード
      description: Add any other context or code snippets that reproduce the issue. / その他、不具合に関する補足情報や、不具合が発生する呼び出し部分のコードを記載してください。

  - type: markdown
    attributes:
      value: |
        ---
        **🚨 WARNING / 警告 🚨**
        **DO NOT** attach proprietary `.sspj` project files or sensitive data to this public issue. 
        If you need to share reproduction data, please submit it privately via the [Help Center](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/).
        
        **絶対に** 機密情報や非公開の `.sspj` プロジェクトデータをここに添付しないでください。
        再現データの提供が必要な場合は、[公式ヘルプセンター](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/)から非公開で送信してください。
