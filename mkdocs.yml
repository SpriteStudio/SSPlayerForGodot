site_name: SpriteStudioPlayer for Godot
site_description: "A Godot Engine integration for SpriteStudio 7"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSPlayerForGodot/"
repo_name: "cri-middleware/SSPlayerForGodot"
repo_url: "https://github.com/cri-middleware/SSPlayerForGodot"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true

nav:
  - Home: index.md
  - Setup:
      - Installation: setup/install.md
      - Build Guide: setup/build.md
  - Workflow:
      - Basic Usage: workflow/usage_basic.md
      - Asset Import & Editor Integration: workflow/usage_asset_pipeline.md
      - Scripting & Events: workflow/usage_scripting.md
      - AnimationPlayer Integration: workflow/animation_player.md
      - Exporting Your Project: workflow/export.md
  - Advanced Topics:
      - CLI Conversion & CI/CD: workflow/import.md
      - Performance Tuning & Advanced Settings: workflow/tips.md
  - API Reference:
      - SpriteStudioPlayer2D: api/player.md
      - Resource Classes: api/resource.md
  - Limitations & Scope: limitations.md
  - Migration Guide: migration_from_v1.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ./ja/
      lang: ja
