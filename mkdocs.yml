site_name: SpriteStudioPlayer for Godot
site_description: "A Godot Engine integration for SpriteStudio 7"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSPlayerForGodot/"
repo_name: "cri-middleware/SSPlayerForGodot"
repo_url: "https://github.com/cri-middleware/SSPlayerForGodot"
# No `edit_uri`, so Material renders no "edit this page" button. The value is a branch name
# that nothing validates -- `--strict` does not look at it -- and it was already wrong in
# three of the five player repos (this one's default branch is `develop`). The footer
# repo link and CONTRIBUTING.md already route corrections. Deleted rather than left inert.
# Rendered in the site footer. Deliberately year-less so it never goes stale.
copyright: "Copyright &copy; CRI Middleware Co., Ltd."

# Nothing builds the docs on a pull request - pages.yml runs on `release: published` and
# dispatch - so the local build is the only gate, and a plain `build`/`serve` should fail on
# a broken link too rather than depend on remembering `--strict`.
strict: true

theme:
  name: material
  language: en
  # Only overrides/main.html lives here: it appends the Open Graph / Twitter Card metadata
  # that Material does not emit on its own.
  custom_dir: overrides
  # Matches this player's card on the SpriteStudio-Docs landing page. A bundled Material
  # icon, so it needs no image file; there is no SpriteStudio artwork for a favicon yet.
  icon:
    logo: simple/godotengine
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    # Previous / next links in the footer, so the guides can be read in order.
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          # Feeds <meta name="description"> and the Open Graph tags on every ja page;
          # without it they inherit the top-level English site_description.
          site_description: "SpriteStudio 7 のアニメーションを Godot Engine で再生するプラグイン"
          extra:
            # Footer icon labels (title / aria-label). Mirrors the `extra.social` list below.
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/cri-middleware
                name: GitHub の cri-middleware
              - icon: material/web
                link: https://www.webtech.co.jp/spritestudio/
                name: OPTPiX SpriteStudio
              - icon: fontawesome/brands/x-twitter
                link: https://x.com/spritestudio
                name: X の SpriteStudio
          # Japanese nav labels. Keys must match the `nav:` titles below *exactly*,
          # emoji included - a mismatched key silently leaves the English label.
          nav_translations:
            🏠 Home: 🏠 ホーム
            🚀 Setup: 🚀 セットアップ
            Installation: インストール
            Build Guide: ビルドガイド
            🎬 Workflow: 🎬 ワークフロー
            Basic Usage: 基本的な使い方
            Asset Import & Editor Integration: アセットのインポートとエディタ連携
            Scripting & Events: スクリプト制御とイベント
            AnimationPlayer Integration: AnimationPlayer 連携
            Exporting Your Project: プロジェクトのエクスポート
            ⚙️ Advanced Topics: ⚙️ 高度なトピック
            CLI Conversion & CI/CD: CLI コンバートと CI/CD
            Performance Tuning & Advanced Settings: パフォーマンスチューニングと高度な設定
            📖 API Reference: 📖 API リファレンス
            SpriteStudioPlayer2D: SpriteStudioPlayer2D
            Resource Classes: リソース管理クラス
            ⚠️ Limitations & Scope: ⚠️ 仕様と制約事項
            🔄 Migration Guide: 🔄 マイグレーションガイド

nav:
  - 🏠 Home: index.md
  - 🚀 Setup:
      - Installation: setup/install.md
      - Build Guide: setup/build.md
  - 🎬 Workflow:
      - Basic Usage: workflow/usage_basic.md
      - Asset Import & Editor Integration: workflow/usage_asset_pipeline.md
      - Scripting & Events: workflow/usage_scripting.md
      - AnimationPlayer Integration: workflow/animation_player.md
      - Exporting Your Project: workflow/export.md
  - ⚙️ Advanced Topics:
      - CLI Conversion & CI/CD: workflow/import.md
      - Performance Tuning & Advanced Settings: workflow/tips.md
  - 📖 API Reference:
      - SpriteStudioPlayer2D: api/player.md
      - Resource Classes: api/resource.md
  - ⚠️ Limitations & Scope: limitations.md
  - 🔄 Migration Guide: migration_from_v1.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  # Footer icons. Keep to destinations that outlive any single release.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: OPTPiX SpriteStudio
    # Keep the handle here in sync with `twitter:site` in overrides/main.html.
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ./ja/
      lang: ja
